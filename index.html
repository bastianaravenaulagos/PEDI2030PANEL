<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de Seguimiento PEDI 2030</title>
<meta name="description" content="Panel de seguimiento de los indicadores estratégicos del PEDI 2030 de la Universidad de Los Lagos, primer y segundo sexenio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: banda institucional con las tres franjas del logo, barra de control fija (sexenio · eje · búsqueda),
   resumen del período y ejes desplegables cuyas filas abren la ficha de cada indicador. */
:root {
  --bg: #F2F5FA;
  --surface: #FFFFFF;
  --surface-2: #F6F8FC;
  --tint: #EBF0F8;
  --ink: #13213A;
  --ink-2: #44526C;
  --muted: #66738C;
  --line: #DDE4EE;
  --line-2: #C3CDDC;
  --brand: #0B3D99;
  --brand-2: #082E75;
  --on-brand: #FFFFFF;
  --on-brand-2: #C9D7F2;
  --focus: #2462C9;
  --active: #0B3D99;
  --stripe-red: #EF3C44;
  --stripe-teal: #05666B;
  --stripe-gold: #D6A329;

  --c1: #2462C9; --c2: #F0631C; --c3: #7E57C5; --c4: #5FA318; --c5: #00949C; --c6: #D69E1F;
  --c-gray: #A9B4C6;
  --e-LID: var(--c1); --e-APR: var(--c2); --e-INV: var(--c3); --e-VCM: var(--c4); --e-SOS: var(--c5);
  --d-LID: #1D4FA8; --d-APR: #B9480F; --d-INV: #5F40A3; --d-VCM: #3E730D; --d-SOS: #006A71;

  --ok: #17673D; --ok-bg: #E1F2E8;
  --up: #1D4FA8; --up-bg: #E3ECFA;
  --flat: #4D5B74; --flat-bg: #E9EDF4; --flat-sw: #8A97AD;
  --warn: #8A5A00; --warn-bg: #FBF0D6;
  --bad: #A82D24; --bad-bg: #FBE5E1;
  --none: #66738C; --none-bg: transparent;

  --risk-low: #5FA318; --risk-mid: #D69E1F; --risk-high: #D2462F;
  --pos-2: #1D4FA8; --pos-1: #7FA6E6; --neg-1: #F3A27A; --neg-2: #C24E12;
  --heat-lo: #EEF3FB; --heat-hi: #163F8C;
  --hl: #FFE6A1;

  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Barlow', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;

  --r-sm: 6px; --r-md: 10px;
  --shadow: 0 1px 2px rgba(19, 33, 58, .06), 0 4px 14px rgba(19, 33, 58, .05);
  --maxw: 1180px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1220; --surface: #141B2A; --surface-2: #182133; --tint: #1C2740;
    --ink: #E7ECF5; --ink-2: #B7C1D4; --muted: #8D99B0; --line: #253049; --line-2: #33405C;
    --brand: #0E2B66; --brand-2: #0A1F4B; --on-brand: #FFFFFF; --on-brand-2: #AFC2E8; --focus: #8DB3F5; --active: #3166C9;
    --c1: #4F86E8; --c2: #E2621F; --c3: #9B7BE0; --c4: #5E9E22; --c5: #1FA5AD; --c6: #B8891E; --c-gray: #56637C;
    --d-LID: #4F86E8; --d-APR: #C9571B; --d-INV: #7F62C9; --d-VCM: #4C8A18; --d-SOS: #158B92;
    --ok: #7FD3A2; --ok-bg: #143324; --up: #9DBDF5; --up-bg: #18294A; --flat: #B7C1D4; --flat-bg: #222C40; --flat-sw: #6C7A94;
    --warn: #F0C46A; --warn-bg: #3A2C0E; --bad: #F4998D; --bad-bg: #40191A; --none: #8D99B0;
    --risk-low: #5E9E22; --risk-mid: #B8891E; --risk-high: #D9573F;
    --pos-2: #4F86E8; --pos-1: #2F4E86; --neg-1: #8A4A2A; --neg-2: #E2621F;
    --heat-lo: #1A2338; --heat-hi: #6F9DEB; --hl: #5C4A12;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1220; --surface: #141B2A; --surface-2: #182133; --tint: #1C2740;
  --ink: #E7ECF5; --ink-2: #B7C1D4; --muted: #8D99B0; --line: #253049; --line-2: #33405C;
  --brand: #0E2B66; --brand-2: #0A1F4B; --on-brand: #FFFFFF; --on-brand-2: #AFC2E8; --focus: #8DB3F5; --active: #3166C9;
  --c1: #4F86E8; --c2: #E2621F; --c3: #9B7BE0; --c4: #5E9E22; --c5: #1FA5AD; --c6: #B8891E; --c-gray: #56637C;
  --d-LID: #4F86E8; --d-APR: #C9571B; --d-INV: #7F62C9; --d-VCM: #4C8A18; --d-SOS: #158B92;
  --ok: #7FD3A2; --ok-bg: #143324; --up: #9DBDF5; --up-bg: #18294A; --flat: #B7C1D4; --flat-bg: #222C40; --flat-sw: #6C7A94;
  --warn: #F0C46A; --warn-bg: #3A2C0E; --bad: #F4998D; --bad-bg: #40191A; --none: #8D99B0;
  --risk-low: #5E9E22; --risk-mid: #B8891E; --risk-high: #D9573F;
  --pos-2: #4F86E8; --pos-1: #2F4E86; --neg-1: #8A4A2A; --neg-2: #E2621F;
  --heat-lo: #1A2338; --heat-hi: #6F9DEB; --hl: #5C4A12;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: var(--maxw); margin-inline: auto; padding-inline: clamp(16px, 3vw, 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------ cabecera */
.masthead { background: var(--brand); color: var(--on-brand); position: relative; }
.masthead .wrap { display: grid; grid-template-columns: auto 1fr; gap: clamp(16px, 4vw, 48px); align-items: center; padding-block: 28px 30px; }
.masthead .logo { height: 66px; width: auto; display: block; }
.masthead .eyebrow { margin: 0; font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; color: var(--on-brand-2); font-weight: 600; }
.masthead h1 { margin: 2px 0 6px; font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 4.6vw, 3.1rem); line-height: 1.02; letter-spacing: .005em; text-wrap: balance; }
.masthead h1 span { color: var(--on-brand-2); font-weight: 500; }
.masthead .lede { margin: 0; max-width: 62ch; color: var(--on-brand-2); font-size: 1rem; }
.stripes { display: grid; grid-template-rows: repeat(3, 4px); }
.stripes i { display: block; }
.stripes i:nth-child(1) { background: var(--stripe-red); }
.stripes i:nth-child(2) { background: var(--stripe-teal); }
.stripes i:nth-child(3) { background: var(--stripe-gold); }
@media (max-width: 640px) {
  .masthead .wrap { grid-template-columns: 1fr; gap: 14px; padding-block: 20px 22px; }
  .masthead .logo { height: 52px; }
}

/* ------------------------------------------------ barra de control */
.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
.controls .wrap { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 12px; }
.seg { display: inline-flex; background: var(--tint); border-radius: 999px; padding: 4px; gap: 4px; flex: 0 0 auto; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 7px 16px; cursor: pointer; display: grid; text-align: left; line-height: 1.15; }
.seg button b { font-family: var(--font-display); font-size: 1.08rem; font-weight: 600; letter-spacing: .01em; }
.seg button small { font-size: .74rem; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--active); color: var(--on-brand); }
.seg button[aria-checked="true"] small { color: var(--on-brand-2); }
.seg button:not([aria-checked="true"]):hover { background: var(--surface); }
.chips { display: flex; gap: 6px; overflow-x: auto; flex: 1 1 100%; order: 3; min-width: 0; padding-block: 2px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-size: .9rem; white-space: nowrap; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.chip:not([aria-pressed="true"]):hover { border-color: var(--ink-2); }
.tools { display: flex; gap: 8px; align-items: center; flex: 1 1 260px; justify-content: flex-end; min-width: 0; }
.search { position: relative; flex: 1 1 260px; max-width: 420px; min-width: 0; }
.sugg { position: absolute; top: calc(100% + 6px); right: 0; width: min(640px, calc(100vw - 32px)); max-height: min(70vh, 580px); overflow: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 16px 40px rgba(8, 16, 34, .2); z-index: 40; padding: 6px; text-align: left; }
.sugg-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 6px 10px; font-size: .76rem; color: var(--muted); }
.sugg-grp { padding: 10px 10px 4px; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.opt { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; align-items: start; }
.opt[aria-selected="true"] { background: var(--tint); }
.opt b { font-weight: 600; font-size: .92rem; line-height: 1.3; display: block; }
.opt small { color: var(--muted); font-size: .78rem; display: block; margin-top: 2px; }
.opt small.rel { font-style: italic; color: var(--ink-2); }
.opt mark { background: var(--hl); color: inherit; border-radius: 2px; padding: 0 1px; }
.opt .code { margin-top: 1px; }
.sugg-empty { margin: 0; padding: 12px 10px; color: var(--ink-2); font-size: .88rem; }
.sugg-foot { position: sticky; bottom: -6px; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 4px 6px; margin-top: 6px; }
.sugg-foot .btn { width: 100%; white-space: normal; text-align: center; }
.sugg-foot .btn:disabled { opacity: .6; cursor: default; }
.qbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 12px 16px; font-size: .92rem; }
.qbar > span { flex: 1 1 320px; min-width: 0; }
.reltag { font-style: italic; }
.search input { width: 100%; border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 999px; padding: 7px 12px 7px 34px; font-size: .92rem; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: .86rem; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }

@media (max-width: 700px) { .controls { position: static; box-shadow: none; } .tools { flex: 1 1 100%; justify-content: flex-start; } .search { max-width: none; } .sugg { left: 0; right: auto; width: calc(100vw - 32px); } }

/* ------------------------------------------------ resumen */
main { padding-block: 28px 56px; display: grid; gap: 28px; }
.summary { display: grid; gap: 18px; }
.summary-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.summary-head h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 3vw, 2rem); line-height: 1.1; text-wrap: balance; }
.summary-head p { margin: 0; color: var(--muted); font-size: .9rem; max-width: 70ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.tile .v { font-size: 2rem; font-weight: 600; line-height: 1.05; }
.tile .l { font-size: .88rem; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tile.lead { background: var(--active); border-color: var(--active); color: var(--on-brand); }
.tile.lead .l { color: var(--on-brand-2); }
.dist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; display: grid; gap: 10px; }
.dist-row { display: grid; grid-template-columns: minmax(150px, 320px) 1fr 52px; gap: 12px; align-items: center; border: 0; background: none; padding: 4px 6px; margin-inline: -6px; border-radius: var(--r-sm); cursor: pointer; text-align: left; }
.dist-row:hover { background: var(--tint); }
.dist-row[aria-pressed="true"] { background: var(--tint); box-shadow: inset 0 0 0 1px var(--line-2); }
.dist-row .name { display: flex; align-items: center; gap: 8px; font-size: .92rem; font-weight: 500; min-width: 0; }
.dist-row .name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dist-row .tot { text-align: right; color: var(--muted); font-size: .88rem; }
.bar { display: flex; height: 14px; gap: 2px; border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.legend i.ln { height: 3px; border-radius: 2px; width: 16px; }
.legend i.dash { height: 0; width: 18px; border-top: 2px dashed var(--ink-2); border-radius: 0; }
@media (max-width: 560px) { .dist-row { grid-template-columns: 1fr 40px; } .dist-row .bar { grid-column: 1 / -1; grid-row: 2; } }

/* ------------------------------------------------ estados */
.st { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px 3px 8px; font-size: .8rem; font-weight: 600; white-space: nowrap; line-height: 1.3; }
.st svg { width: 13px; height: 13px; flex: none; }
.st-ok { color: var(--ok); background: var(--ok-bg); }
.st-up { color: var(--up); background: var(--up-bg); }
.st-flat { color: var(--flat); background: var(--flat-bg); }
.st-warn { color: var(--warn); background: var(--warn-bg); }
.st-bad { color: var(--bad); background: var(--bad-bg); }
.st-none { color: var(--none); background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
.st-build { color: var(--none); background: transparent; box-shadow: none; border: 1px dashed var(--line-2); padding-block: 2px; }
.sw-ok { background: var(--ok); } .sw-up { background: var(--up); } .sw-flat { background: var(--flat-sw); }
.sw-warn { background: var(--flat-sw); } .sw-bad { background: var(--flat-sw); } .sw-none { background: var(--line-2); }
.sw-build { background: repeating-linear-gradient(135deg, var(--line-2) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--line-2); }

/* ------------------------------------------------ ejes */
.ejes { display: grid; gap: 18px; }
.eje { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: clip; }
.eje-head { width: 100%; border: 0; background: var(--surface); display: grid; grid-template-columns: 52px 1fr auto 24px; gap: 16px; align-items: center; padding: 16px 18px; cursor: pointer; text-align: left; }
.eje-head:hover { background: var(--surface-2); }
.eje-num { width: 52px; height: 52px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1; }
.eje-title { min-width: 0; }
.eje-title small { display: block; font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.eje-title h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.3rem, 2.4vw, 1.65rem); line-height: 1.1; text-wrap: balance; }
.eje-meta { display: grid; gap: 6px; justify-items: end; min-width: 160px; }
.eje-meta .bar { width: 180px; height: 8px; }
.eje-meta span { font-size: .84rem; color: var(--muted); }
.chev { width: 22px; height: 22px; stroke: var(--ink-2); fill: none; stroke-width: 2; transition: transform .2s ease; }
[aria-expanded="true"] > .chev, [aria-expanded="true"] .chev-r { transform: rotate(180deg); }
@media (max-width: 640px) {
  .eje-head { grid-template-columns: 44px 1fr 22px; gap: 12px; padding: 14px; }
  .eje-num { width: 44px; height: 44px; font-size: 1.6rem; }
  .eje-meta { grid-column: 2 / 3; grid-row: 2; justify-items: start; min-width: 0; }
  .eje-meta .bar { width: 100%; max-width: 220px; }
  .eje-head .chev { grid-column: 3; grid-row: 1; }
}
.oe { border-top: 1px solid var(--line); }
.oe-head { padding: 14px 18px 8px 86px; display: grid; gap: 2px; }
.oe-head b { font-family: var(--font-display); font-weight: 600; font-size: 1.12rem; letter-spacing: .01em; }
.oe-head b span { color: var(--muted); font-weight: 500; margin-right: 6px; }
.oe-head p { margin: 0; color: var(--ink-2); font-size: .88rem; max-width: 92ch; }
@media (max-width: 640px) { .oe-head { padding-left: 14px; } }

/* ------------------------------------------------ fila de indicador */
.ind { border-top: 1px solid var(--line); }
.oe-head + .ind { border-top: 0; }
.ind-row { width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left; display: grid; grid-template-columns: 52px minmax(0, 1fr) 120px 128px 150px 20px; gap: 16px; align-items: center; padding: 12px 18px; }
.ind-row:hover { background: var(--surface-2); }
.ind[data-open="true"] .ind-row { background: var(--tint); }
.code { font-size: .78rem; font-weight: 700; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 2px 0; text-align: center; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.ind-name { min-width: 0; }
.ind-name b { display: block; font-weight: 600; font-size: .98rem; line-height: 1.3; }
.ind-name small { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
.spark { width: 120px; height: 34px; display: block; }
.last { display: grid; justify-items: end; line-height: 1.15; }
.last b { font-size: 1.08rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.last small { font-size: .76rem; color: var(--muted); white-space: nowrap; }
.ind-row .st { justify-self: start; }
.chev-r { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform .2s ease; }
@media (max-width: 900px) {
  .ind-row { grid-template-columns: 46px minmax(0, 1fr) 112px 18px; row-gap: 8px; }
  .ind-row .spark { grid-column: 2; grid-row: 2; }
  .ind-row .last { grid-column: 3; grid-row: 1; }
  .ind-row .st { grid-column: 3; grid-row: 2; justify-self: end; }
  .ind-row .chev-r { grid-column: 4; grid-row: 1; }
}
@media (max-width: 520px) {
  .ind-row { grid-template-columns: 42px minmax(0, 1fr) 18px; padding: 12px 14px; }
  .ind-row .spark { display: none; }
  .ind-row .last { grid-column: 2; grid-row: 2; justify-items: start; display: flex; gap: 8px; align-items: baseline; }
  .ind-row .st { grid-column: 2; grid-row: 3; justify-self: start; }
  .ind-row .chev-r { grid-column: 3; grid-row: 1; }
}

/* ------------------------------------------------ ficha */
.detail { padding: 6px 18px 22px 86px; display: grid; gap: 18px; }
@media (max-width: 640px) { .detail { padding: 6px 14px 18px; } }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(250px, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; min-width: 0; }
.panel h4 { margin: 0 0 2px; font-size: .98rem; font-weight: 600; }
.panel .sub { margin: 0 0 10px; color: var(--muted); font-size: .84rem; }
.chart { width: 100%; min-height: 120px; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.facts { display: grid; gap: 0; margin: 0; }
.facts div { display: grid; grid-template-columns: 128px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.facts div:first-child { border-top: 0; padding-top: 0; }
.facts dt { color: var(--muted); font-size: .84rem; }
.facts dd { margin: 0; font-size: .9rem; min-width: 0; overflow-wrap: anywhere; }
.facts dd b { font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.kv div { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 2px; }
.kv span { font-size: .76rem; color: var(--muted); }
.kv b { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; overflow-wrap: break-word; }
.kv b.small { font-size: .92rem; display: grid; gap: 2px; }
.note { margin: 10px 0 0; font-size: .84rem; color: var(--ink-2); }
.xlink { border: 0; background: none; color: var(--up); text-decoration: underline; text-underline-offset: 3px; padding: 0; cursor: pointer; font-size: .88rem; text-align: left; }
.empty { border: 1px dashed var(--line-2); border-radius: var(--r-md); padding: 22px; display: grid; gap: 4px; place-items: center; text-align: center; color: var(--ink-2); min-height: 180px; align-content: center; }
.empty b { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; color: var(--ink); }
.desag h5 { margin: 0 0 8px; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tab { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .84rem; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.src { margin: 8px 0 0; font-size: .78rem; color: var(--muted); }
details.tbl { margin-top: 10px; }
details.tbl summary { cursor: pointer; font-size: .82rem; color: var(--ink-2); width: max-content; }
.tbl-wrap { overflow-x: auto; margin-top: 8px; }
.tbl-wrap table { border-collapse: collapse; font-size: .82rem; font-variant-numeric: tabular-nums; min-width: 100%; }
.tbl-wrap th, .tbl-wrap td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tbl-wrap th:first-child, .tbl-wrap td:first-child { text-align: left; white-space: normal; min-width: 140px; }
.tbl-wrap thead th { color: var(--muted); font-weight: 600; }
.chips-out { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* ------------------------------------------------ svg */
.ax text, .lbl { font-family: var(--font-body); font-size: 12px; fill: var(--muted); }
.ax line, .grid line { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
.ax .base { stroke: var(--line-2); }
.vlab { font-family: var(--font-body); font-size: 12.5px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.vlab.muted { fill: var(--muted); font-weight: 500; }
.metaline { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.metalab { font-family: var(--font-body); font-size: 12px; font-weight: 600; fill: var(--ink-2); }
.notelab { font-family: var(--font-body); font-size: 11px; fill: var(--muted); font-style: italic; }
.hit { fill: transparent; cursor: crosshair; }
.hit:focus { outline: none; }
.hit:focus-visible { stroke: var(--focus); stroke-width: 2; }
.xhair { stroke: var(--line-2); stroke-width: 1; }
.mark-hover { opacity: .78; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: .82rem; min-width: 120px; max-width: 280px; }
#tip .t { color: var(--muted); font-size: .76rem; margin-bottom: 4px; }
#tip .r { display: grid; grid-template-columns: 14px auto 1fr; gap: 6px; align-items: center; }
#tip .r i { height: 3px; border-radius: 2px; }
#tip .r b { font-variant-numeric: tabular-nums; }
#tip .r span { color: var(--ink-2); }
#tip .n { color: var(--muted); font-size: .76rem; margin-top: 4px; }

.panel-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.panel-head > :first-child { min-width: 0; }
.panel-head h4 { margin: 0 0 2px; }
.desag .panel-head h4 { margin-bottom: 8px; }
.vtools { display: flex; gap: 6px; flex: none; }
.vbtn { height: 30px; min-width: 30px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 7px; cursor: pointer; color: var(--ink-2); padding: 0 6px; }
.vbtn:hover { border-color: var(--ink-2); color: var(--ink); background: var(--surface-2); }
.vbtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.vbtn.xl { padding: 0 8px 0 6px; font-size: .72rem; font-weight: 700; letter-spacing: .04em; }
dialog.viz { border: 0; padding: 0; border-radius: 12px; width: min(1140px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(8, 16, 34, .35); }
dialog.viz::backdrop { background: rgba(8, 16, 34, .55); }
.viz-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; padding: 18px 22px 4px; }
.viz-title { min-width: 0; }
.viz-eyebrow { margin: 0; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.viz-head h3 { margin: 2px 0 2px; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.25rem, 2.4vw, 1.6rem); line-height: 1.15; text-wrap: balance; }
.viz-head .sub { margin: 0; color: var(--muted); font-size: .86rem; }
.viz-body { padding: 4px 22px 22px; overflow: auto; max-height: calc(100vh - 150px); }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-size: .86rem; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

footer { border-top: 1px solid var(--line); background: var(--surface); }
footer .wrap { padding-block: 22px 30px; display: grid; gap: 8px; font-size: .84rem; color: var(--ink-2); }
footer p { margin: 0; max-width: 100ch; }
.noresult { padding: 30px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--r-md); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>

<script>
(function () {
'use strict';

const DATA = JSON.parse(document.getElementById('pedi-data').textContent);
const NS = 'http://www.w3.org/2000/svg';
const EJE_IDS = ['LID', 'APR', 'INV', 'VCM', 'SOS'];

const ejeDeep = (e) => `var(--d-${e})`;
const SHORT = { LID: 'Liderazgo', APR: 'Aprendizaje', INV: 'Investigación', VCM: 'Vinculación con el Medio', SOS: 'Sostenibilidad' };

const EQUIV = { 's2-1': 's1-1', 's2-2': 's1-2', 's2-3': 's1-3', 's2-4': 's1-4', 's2-8': 's1-5', 's2-9': 's1-6', 's2-10': 's1-7',
  's2-12': 's1-12', 's2-18': 's1-13', 's2-20': 's1-14', 's2-22': 's1-17', 's2-23': 's1-8', 's2-26': 's1-20', 's2-28': 's1-19',
  's2-42': 's1-32', 's2-44': 's1-33', 's2-45': 's1-34' };
const EQUIV_R = Object.fromEntries(Object.entries(EQUIV).map(([a, b]) => [b, a]));

const state = { sx: 's2', eje: 'all', q: '', open: new Set(), closedEjes: new Set() };
try { const s = localStorage.getItem('pedi-sx'); if (s === 's1' || s === 's2') state.sx = s; } catch (e) { /* sin almacenamiento */ }

/* ================================================================ formato */
const nf0 = new Intl.NumberFormat('es-CL', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('es-CL', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v, d = 1) => (d === 0 ? nf0 : nf1).format(v * 100) + '%';
const rankLabel = (r) => (r[0] === r[1] ? nf0.format(r[0]) : `${r[0]}–${r[1]}`);
const RISK_ORDER = { Bajo: 1, Medio: 2, Alto: 3 };

function suffix(ind) {
  if (ind.tipo === 'dec') return ind.unidad === 'años' ? ' años' : (ind.unidad.indexOf('m²') === 0 ? ' m²' : '');
  return '';
}
function fmtVal(ind, v) {
  if (v == null) return '—';
  switch (ind.tipo) {
    case 'pct': return pct(v);
    case 'pp': return nf1.format(v * 100) + ' p.p.';
    case 'num': return nf0.format(v);
    case 'dec': return nf2.format(v) + suffix(ind);
    case 'mm': return 'MM$ ' + nf0.format(v);
    case 'm2': return nf0.format(v) + ' m²';
    case 'rank': return rankLabel(v);
    case 'risk': return 'Riesgo ' + v.toLowerCase();
    case 'frac': return v + ' de 5';
    case 'dual': return ind.dualNames.map((n, i) => `${n} ${pct(v[i])}`).join(' · ');
  }
  return String(v);
}
function fmtShort(ind, v) {            // para rótulos dentro de gráficos
  if (v == null) return '';
  switch (ind.tipo) {
    case 'pct': return pct(v);
    case 'pp': return nf1.format(v * 100);
    case 'num': case 'm2': return nf0.format(v);
    case 'dec': return nf2.format(v);
    case 'mm': return nf0.format(v);
  }
  return fmtVal(ind, v);
}
function axisFmt(kind, step) {
  return (v) => {
    if (kind === 'pct') return (step < 0.01 ? nf1 : nf0).format(v * 100) + '%';
    if (kind === 'pp') return nf1.format(v * 100);
    if (kind === 'dec' || kind === 'dec1') return (step < 1 ? (step < 0.1 ? nf2 : nf1) : nf0).format(v);
    return nf0.format(v);
  };
}
function metaText(ind) {
  if (ind.metaLabel) return ind.metaLabel.replace(/([≥≤]) /g, '$1\u00A0').replace('MM$ ', 'MM$\u00A0');
  if (!ind.meta || ind.meta.value == null) return 'Sin meta definida';
  const v = ind.meta.value;

  for (let i = 0; i < n; i++) {
    const r = s('rect', { class: 'hit', x: M.l + step * i, y: M.t, width: step, height: ph, 'aria-label': `${cfg.x[i]}: ` + series.map((se) => `${se.name || ''} ${se.values[i] == null ? (notes[i] || 'sin dato') : cfg.fmtLong(se.values[i])}`).join('; ') }, svg);
    bindHover(r, (e) => {
      if (kind === 'line') { xh.setAttribute('x1', xc(i)); xh.setAttribute('x2', xc(i)); xh.style.opacity = 1; }
      marks.forEach((ms, j) => ms.forEach((m) => m.classList.toggle('mark-hover', j !== i && kind !== 'line')));
      const rows = series.map((se) => ({ color: se.color, value: se.values[i] == null ? (notes[i] || 'Sin dato') : cfg.fmtLong(se.values[i]), name: series.length > 1 || cfg.alwaysName ? se.name : '' }));
      if (kind === 'stack' && series.length > 1) rows.push({ color: 'transparent', value: cfg.fmtLong(vals[i]), name: 'Total' });
      showTip(e, cfg.x[i] + (cfg.sub && cfg.sub[i] ? ` · ${cfg.sub[i]}` : '') + (prelim[i] ? ' · preliminar' : ''), rows, cfg.tipNote ? cfg.tipNote[i] : null);
    }, () => { xh.style.opacity = 0; marks.forEach((ms) => ms.forEach((m) => m.classList.remove('mark-hover'))); });
  }
  return svg;
}

/* ================================================================ ranking (posición, eje invertido) */
function rankChart(el, W, cfg) {
  const n = cfg.x.length;
  const H = cfg.height || (W < 480 ? 230 : 260);
  const items = cfg.items;
  const all = [];
  items.forEach((it) => { if (it) all.push(it[0], it[1]); });
  if (cfg.meta) all.push(cfg.meta[0], cfg.meta[1]);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = Math.max(8, (hi - lo) * 0.15);
  lo = Math.max(1, lo - pad); hi = hi + pad;
  const nt = niceTicks(lo, hi, 4);
  nt.lo = Math.max(nt.lo, 0);
  const M = { t: 26, r: 12, b: 40, l: 44 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  const y = (p) => M.t + ((p - nt.lo) / (nt.hi - nt.lo)) * ph;   // 1 arriba
  const step = pw / n, xc = (i) => M.l + step * (i + 0.5);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': cfg.aria || '' });
  el.appendChild(svg);
  const gAx = s('g', { class: 'ax' }, svg), gGrid = s('g', { class: 'grid' }, svg);
  nt.ticks.forEach((t) => {
    if (t < nt.lo) return;
    s('line', { x1: M.l, x2: W - M.r, y1: y(t), y2: y(t) }, gGrid);
    stext(gAx, M.l - 8, y(t) + 4, t === 0 ? '1' : nf0.format(t), { 'text-anchor': 'end' });
  });
  stext(gAx, M.l - 8, 12, '↑ mejor posición', { 'text-anchor': 'start', style: 'font-size:11px' });
  cfg.x.forEach((lab, i) => {
    stext(gAx, xc(i), H - M.b + 17, lab + (cfg.prelim[i] ? '*' : ''), { 'text-anchor': 'middle', style: 'fill:var(--ink-2)' });
    if (cfg.sub && cfg.sub[i]) stext(gAx, xc(i), H - M.b + 31, cfg.sub[i], { 'text-anchor': 'middle', style: 'font-size:11px' });
  });
  if (cfg.meta) {
    const y0 = y(Math.max(cfg.meta[0], nt.lo)), y1 = y(cfg.meta[1]);
    s('rect', { x: M.l, width: pw, y: y0, height: Math.max(2, y1 - y0), style: 'fill:var(--ok-bg)' }, svg);
    s('line', { x1: M.l, x2: W - M.r, y1: y1, y2: y1, class: 'metaline', style: 'stroke:var(--ok)' }, svg);
    const lab = 'Meta: ' + cfg.metaLabel;
    stext(svg, M.l + 6, y0 + 14, lab, { class: 'metalab', style: 'fill:var(--ok)' });
  }
  const pts = items.map((it, i) => (it ? [xc(i), y(mid(it))] : null));
  for (let i = 1; i < n; i++) if (pts[i] && pts[i - 1]) s('line', { x1: pts[i - 1][0], y1: pts[i - 1][1], x2: pts[i][0], y2: pts[i][1], style: `stroke:${cfg.color};stroke-width:1.5;opacity:.45` }, svg);
  items.forEach((it, i) => {
    if (!it) {
      if (cfg.notes[i]) stext(svg, xc(i), M.t + ph - 6, step > 70 ? cfg.notes[i] : '—', { class: 'notelab', 'text-anchor': 'middle' });
      return;
    }
    const fill = cfg.prelim[i] ? hatch(svg, cfg.color) : cfg.color;
    if (it[0] === it[1]) s('circle', { cx: xc(i), cy: y(it[0]), r: 6.5, style: `fill:${fill};stroke:${cfg.prelim[i] ? cfg.color : 'var(--surface)'};stroke-width:2` }, svg);
    else {
      const y0 = y(it[0]), y1 = y(it[1]);
      s('rect', { x: xc(i) - 7, y: y0, width: 14, height: Math.max(10, y1 - y0), rx: 7, style: `fill:${fill};${cfg.prelim[i] ? `stroke:${cfg.color};stroke-width:1.5` : ''}` }, svg);
    }
    const lab = rankLabel(it);
    const prevIt = items.slice(0, i).reverse().find(Boolean);
    const nextIt = items.slice(i + 1).find(Boolean);
    if (prevIt && rankLabel(prevIt) === lab && nextIt && rankLabel(nextIt) === lab) return;
    if (prevIt && rankLabel(prevIt) === lab && i !== n - 1 && step < 90) return;
    const right = step > textW(lab, 12.5, 600) * 2 + 30;
    stext(svg, right ? xc(i) + 12 : xc(i), right ? y(mid(it)) + 4 : y(it[0]) - 8, lab, { class: 'vlab', 'text-anchor': right ? 'start' : 'middle' });
  });
  for (let i = 0; i < n; i++) {
    const r = s('rect', { class: 'hit', x: M.l + step * i, y: M.t, width: step, height: ph, 'aria-label': `${cfg.x[i]}: ${items[i] ? 'posición ' + rankLabel(items[i]) : cfg.notes[i] || 'sin dato'}` }, svg);
    bindHover(r, (e) => showTip(e, cfg.x[i] + (cfg.sub && cfg.sub[i] ? ` · ${cfg.sub[i]}` : '') + (cfg.prelim[i] ? ' · preliminar' : ''),
      [{ color: cfg.color, value: items[i] ? 'Posición ' + rankLabel(items[i]) : cfg.notes[i] || 'Sin dato' }]));
  }
}

/* ================================================================ nivel de riesgo (ordinal) */
function riskChart(el, W, cfg) {
  const n = cfg.x.length, H = cfg.height ? Math.min(cfg.height, 340) : 210;
  const M = { t: 16, r: 14, b: 40, l: 92 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  const lanes = ['Bajo', 'Medio', 'Alto'];
  const ly = (k) => M.t + ph * (lanes.indexOf(k) + 0.5) / 3;
  const step = pw / n, xc = (i) => M.l + step * (i + 0.5);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': cfg.aria || '' });
  el.appendChild(svg);
  const g = s('g', { class: 'ax' }, svg);
  lanes.forEach((k, j) => {
    if (cfg.meta === k) {
      s('rect', { x: M.l, width: pw, y: M.t + ph * j / 3 + 3, height: ph / 3 - 6, rx: 6, style: 'fill:var(--ok-bg)' }, svg);
      stext(svg, W - M.r - 6, M.t + ph * j / 3 + 16, 'Meta', { class: 'metalab', 'text-anchor': 'end', style: 'fill:var(--ok)' });
    }
    s('line', { x1: M.l, x2: W - M.r, y1: ly(k), y2: ly(k) }, g);
    stext(g, M.l - 10, ly(k) + 4, 'Riesgo ' + k.toLowerCase(), { 'text-anchor': 'end', style: 'fill:var(--ink-2)' });
  });
  cfg.x.forEach((lab, i) => {
    stext(g, xc(i), H - M.b + 17, lab + (cfg.prelim[i] ? '*' : ''), { 'text-anchor': 'middle', style: 'fill:var(--ink-2)' });
    if (cfg.sub && cfg.sub[i]) stext(g, xc(i), H - M.b + 31, cfg.sub[i], { 'text-anchor': 'middle', style: 'font-size:11px' });
  });
  let prev = null;
  cfg.values.forEach((v, i) => {
    if (v == null) { prev = null; if (cfg.notes[i]) stext(svg, xc(i), M.t + ph - 4, step > 70 ? cfg.notes[i] : '—', { class: 'notelab', 'text-anchor': 'middle' }); return; }
    if (prev) s('path', { d: `M${prev[0]},${prev[1]}H${(prev[0] + xc(i)) / 2}V${ly(v)}H${xc(i)}`, style: `fill:none;stroke:${cfg.color};stroke-width:2;opacity:.6` }, svg);
    prev = [xc(i), ly(v)];
  });
  cfg.values.forEach((v, i) => {
    if (v == null) return;
    s('circle', { cx: xc(i), cy: ly(v), r: 7, style: `fill:${cfg.prelim[i] ? 'var(--surface)' : cfg.color};stroke:${cfg.prelim[i] ? cfg.color : 'var(--surface)'};stroke-width:2` }, svg);
  });
  for (let i = 0; i < n; i++) {
    const r = s('rect', { class: 'hit', x: M.l + step * i, y: M.t, width: step, height: ph, 'aria-label': `${cfg.x[i]}: ${cfg.values[i] ? 'riesgo ' + cfg.values[i].toLowerCase() : cfg.notes[i] || 'sin dato'}` }, svg);
    bindHover(r, (e) => showTip(e, cfg.x[i] + (cfg.prelim[i] ? ' · preliminar' : ''), [{ color: cfg.color, value: cfg.values[i] ? 'Riesgo ' + cfg.values[i].toLowerCase() : cfg.notes[i] || 'Sin dato' }]));
  }
}

/* ================================================================ avance x de 5 */
function fracChart(el, W, cfg) {
  const n = cfg.x.length, H = cfg.height ? Math.min(cfg.height, 300) : 210;
  const M = { t: 26, r: 12, b: 40, l: 12 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  const step = pw / n, xc = (i) => M.l + step * (i + 0.5);
  const cell = Math.min(20, (ph - 4 * 4) / 5, step * 0.5);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': cfg.aria || '' });
  el.appendChild(svg);
  cfg.values.forEach((v, i) => {
    for (let k = 0; k < 5; k++) {
      const yy = M.t + ph - (k + 1) * cell - k * 4;
      s('rect', { x: xc(i) - cell / 2, y: yy, width: cell, height: cell, rx: 3, style: k < (v || 0) ? `fill:${cfg.color}` : 'fill:none;stroke:var(--line-2);stroke-width:1.2' }, svg);
    }
    stext(svg, xc(i), M.t + ph - 5 * cell - 16 - 6, v == null ? '—' : `${v}/5`, { class: 'vlab', 'text-anchor': 'middle' });
    stext(svg, xc(i), H - M.b + 17, cfg.x[i], { class: 'lbl', 'text-anchor': 'middle', style: 'fill:var(--ink-2)' });
    if (cfg.sub && cfg.sub[i]) stext(svg, xc(i), H - M.b + 31, cfg.sub[i], { class: 'lbl', 'text-anchor': 'middle', style: 'font-size:11px' });
    const r = s('rect', { class: 'hit', x: M.l + step * i, y: M.t, width: step, height: ph, 'aria-label': `${cfg.x[i]}: ${v} de 5 sistemas` }, svg);
    bindHover(r, (e) => showTip(e, cfg.x[i], [{ color: cfg.color, value: `${v} de 5`, name: 'sistemas implantados' }]));
  });
}

/* ================================================================ barras horizontales (simples, agrupadas, apiladas) */
function hbarChart(el, W, cfg) {
  const cats = cfg.cats, k = cfg.series.length, stacked = cfg.stacked;
  const rowH = stacked || k === 1 ? 26 : 10 * k + 2 * (k - 1) + 12;
  const barH = stacked || k === 1 ? 14 : 10;
  const labW = Math.min(W * (W < 520 ? 0.46 : 0.42), Math.max(...cats.map((c) => textW(c, 12))) + 22);
  const valW = stacked ? 8 : Math.max(...cfg.series.flatMap((se) => se.values.map((v) => textW(cfg.fmtShort(v), 12, 600)))) + 12;
  const M = { t: cfg.ref ? 22 : 8, r: Math.max(12, valW), b: 24, l: labW };
  const H = M.t + M.b + rowH * cats.length;
  const pw = W - M.l - M.r;
  let max = cfg.max;
  if (max == null) {
    max = stacked ? Math.max(...cats.map((_, i) => cfg.series.reduce((a, se) => a + (se.values[i] || 0), 0))) : Math.max(...cfg.series.flatMap((se) => se.values.filter((v) => v != null)));
    if (cfg.ref) max = Math.max(max, cfg.ref.value);
  }
  const nt = niceTicks(0, max, W < 480 ? 3 : 4);
  if (cfg.unit === 'pct' && nt.hi > 1 && max <= 1) { nt.hi = 1; nt.ticks = nt.ticks.filter((t) => t <= 1); }
  const x = (v) => M.l + (v / nt.hi) * pw;
  const af = axisFmt(cfg.unit === 'pct' ? 'pct' : cfg.unit === 'dec1' ? 'dec1' : 'num', nt.step);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': cfg.aria || '' });
  el.appendChild(svg);
  const gAx = s('g', { class: 'ax' }, svg), gGrid = s('g', { class: 'grid' }, svg);
  nt.ticks.forEach((t) => {
    s('line', { x1: x(t), x2: x(t), y1: M.t - 2, y2: H - M.b + 2, class: t === 0 ? 'base' : '' }, t === 0 ? gAx : gGrid);
    stext(gAx, x(t), H - M.b + 16, af(t), { 'text-anchor': t === 0 ? 'start' : 'middle' });
  });
  const gB = s('g', null, svg);
  cats.forEach((c, i) => {
    const y0 = M.t + i * rowH;
    const hl = cfg.highlight && c === cfg.highlight;
    stext(gAx, M.l - 8, y0 + rowH / 2 + 4, fit(c, labW - 10), { 'text-anchor': 'end', style: `fill:var(--ink${hl ? '' : '-2'});${hl ? 'font-weight:700' : ''}` });
    const markEls = [];
    if (stacked) {
      let acc = 0;
      const segs = cfg.series.map((se) => ({ se, v: se.values[i] || 0 })).filter((d) => d.v > 0);
      segs.forEach((d, j) => {
        const xa = x(acc) + (j ? 1 : 0), xb = x(acc + d.v) - (j < segs.length - 1 ? 1 : 0);
        const by = y0 + (rowH - barH) / 2;
        const p = s('path', { d: j === segs.length - 1 ? hbarPath(xa, by, xb - xa, barH, 4) : `M${xa},${by}H${xb}V${by + barH}H${xa}Z`, style: `fill:${d.se.color}` }, gB);
        markEls.push(p);
        const str = cfg.fmtShort(d.v);
        if (xb - xa > textW(str, 11, 600) + 8) {
          const light = lum(resolveColor(d.se.color)) < 0.38;
          stext(gB, (xa + xb) / 2, by + barH / 2 + 4, str, { 'text-anchor': 'middle', style: `font-size:11px;font-weight:600;fill:${light ? '#fff' : '#13213A'};pointer-events:none` });
        }
        acc += d.v;
      });
    } else {
      cfg.series.forEach((se, si) => {
        const v = se.values[i];
        const by = y0 + (rowH - (k * barH + 2 * (k - 1))) / 2 + si * (barH + 2);
        if (v == null) { stext(gB, x(0) + 4, by + barH - 1, 's/d', { class: 'notelab' }); return; }
        const col = cfg.highlight ? (hl ? se.color : 'var(--c-gray)') : se.color;
        const p = s('path', { d: hbarPath(x(0), by, x(v) - x(0), barH, 4), style: `fill:${col}` }, gB);
        markEls.push(p);
        if (k <= 2 || barH >= 10) stext(gB, x(v) + 5, by + barH / 2 + 4, cfg.fmtShort(v), { class: 'vlab', style: `font-size:${k > 1 ? 11 : 12}px;${hl ? '' : (cfg.highlight ? 'font-weight:500;fill:var(--ink-2)' : '')}` });
      });
    }
    const hit = s('rect', { class: 'hit', x: 0, y: y0, width: W, height: rowH, 'aria-label': `${c}: ` + cfg.series.map((se) => `${k > 1 ? se.name + ' ' : ''}${cfg.fmtLong(se.values[i])}`).join('; ') }, svg);
    bindHover(hit, (e) => {
      markEls.forEach((m) => m.classList.add('mark-hover'));
      showTip(e, c, cfg.series.map((se) => ({ color: cfg.highlight && !hl ? 'var(--c-gray)' : se.color, value: cfg.fmtLong(se.values[i]), name: k > 1 ? se.name : '' })));
    }, () => markEls.forEach((m) => m.classList.remove('mark-hover')));
  });
  if (cfg.ref) {
    const xr = x(cfg.ref.value);
    s('line', { x1: xr, x2: xr, y1: M.t - 4, y2: H - M.b, class: 'metaline' }, svg);
    stext(svg, xr, 12, cfg.ref.label, { class: 'metalab', 'text-anchor': xr > W - 80 ? 'end' : 'middle' });
  }
}

/* ================================================================ mancuerna (dos años por categoría) */
function dumbbellChart(el, W, cfg) {
  const cats = cfg.cats, rowH = 28;
  const labW = Math.min(W * 0.45, Math.max(...cats.map((c) => textW(c, 12))) + 22);
  const M = { t: 8, r: 46, b: 24, l: labW };
  const H = M.t + M.b + rowH * cats.length, pw = W - M.l - M.r;
  const all = cfg.a.values.concat(cfg.b.values);
  const lo = Math.max(0, Math.floor((Math.min(...all) - 0.05) * 10) / 10), hi = 1;
  const nt = niceTicks(lo, hi, W < 480 ? 3 : 5);
  const x = (v) => M.l + ((v - nt.lo) / (nt.hi - nt.lo)) * pw;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': cfg.aria || '' });
  el.appendChild(svg);
  const g = s('g', { class: 'ax' }, svg), gg = s('g', { class: 'grid' }, svg);
  nt.ticks.forEach((t) => { s('line', { x1: x(t), x2: x(t), y1: M.t, y2: H - M.b }, gg); stext(g, x(t), H - M.b + 16, pct(t, 0), { 'text-anchor': 'middle' }); });
  cats.forEach((c, i) => {
    const yy = M.t + i * rowH + rowH / 2;
    const a = cfg.a.values[i], b = cfg.b.values[i];
    stext(g, M.l - 10, yy + 4, fit(c, labW - 12), { 'text-anchor': 'end', style: 'fill:var(--ink-2)' });
    s('line', { x1: x(a), x2: x(b), y1: yy, y2: yy, style: 'stroke:var(--line-2);stroke-width:3;stroke-linecap:round' }, svg);
    s('circle', { cx: x(a), cy: yy, r: 5, style: 'fill:var(--c-gray);stroke:var(--surface);stroke-width:2' }, svg);
    s('circle', { cx: x(b), cy: yy, r: 6, style: `fill:${cfg.color};stroke:var(--surface);stroke-width:2` }, svg);
    stext(svg, Math.max(x(a), x(b)) + 10, yy + 4, pct(b, 0), { class: 'vlab' });
    const hit = s('rect', { class: 'hit', x: 0, y: yy - rowH / 2, width: W, height: rowH, 'aria-label': `${c}: ${cfg.a.name} ${pct(a)}, ${cfg.b.name} ${pct(b)}` }, svg);
    bindHover(hit, (e) => showTip(e, c, [{ color: 'var(--c-gray)', value: pct(a), name: cfg.a.name }, { color: cfg.color, value: pct(b), name: cfg.b.name }]));
  });
}

/* ================================================================ tabla de calor */
function heatChart(el, W, cfg) {
  const rows = cfg.rows, cols = cfg.cols;
  const labW = Math.min(W * 0.42, Math.max(...rows.map((r) => textW(r, 12))) + 22);
  const cw = (W - labW) / cols.length, chH = 30;
  const H = 22 + rows.length * chH + 4;
  const flat = cfg.values.flat().filter((v) => v != null);
  const lo = Math.min(...flat), hi = Math.max(...flat);
  const cLo = resolveColor('var(--heat-lo)'), cHi = resolveColor('var(--heat-hi)');
  const mix = (t) => {
    const p = (hx) => [1, 3, 5].map((i) => parseInt(hx.slice(i, i + 2), 16));
    const a = p(cLo), b = p(cHi);
    return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');
  };
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': cfg.aria || '' });
  el.appendChild(svg);
  cols.forEach((c, j) => stext(svg, labW + cw * (j + 0.5), 14, c, { class: 'lbl', 'text-anchor': 'middle', style: 'fill:var(--ink-2)' }));
  rows.forEach((r, i) => {
    const yy = 22 + i * chH;
    stext(svg, labW - 10, yy + chH / 2 + 4, fit(r, labW - 12), { class: 'lbl', 'text-anchor': 'end', style: 'fill:var(--ink-2)' });
    cols.forEach((c, j) => {
      const v = cfg.values[i][j];
      const x0 = labW + cw * j;
      if (v == null) { stext(svg, x0 + cw / 2, yy + chH / 2 + 4, '·', { class: 'lbl', 'text-anchor': 'middle' }); return; }
      const t = hi > lo ? (v - lo) / (hi - lo) : 0.5;
      const fill = mix(0.08 + t * 0.92);
      const rect = s('rect', { x: x0 + 1, y: yy + 1, width: cw - 2, height: chH - 2, rx: 3, style: `fill:${fill}` }, svg);
      const str = cfg.fmtShort(v);
      if (cw > textW(str, 11.5, 600) + 6) stext(svg, x0 + cw / 2, yy + chH / 2 + 4, str, { 'text-anchor': 'middle', style: `font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;fill:${lum(fill) < 0.35 ? '#fff' : '#13213A'};pointer-events:none` });
      const hit = s('rect', { class: 'hit', x: x0, y: yy, width: cw, height: chH, 'aria-label': `${r}, ${c}: ${cfg.fmtLong(v)}` }, svg);
      bindHover(hit, (e) => { rect.classList.add('mark-hover'); showTip(e, `${r} · ${c}`, [{ color: fill, value: cfg.fmtLong(v) }]); }, () => rect.classList.remove('mark-hover'));
    });
  });
}

/* ================================================================ franja de posiciones (comparación de universidades) */
function rankStrip(el, W, cfg) {
  const items = cfg.items, rowH = 24;

function spark(ind) {
  const W = 120, H = 34;
  const svg = s('svg', { class: 'spark', viewBox: `0 0 ${W} ${H}`, width: W, height: H, 'aria-hidden': 'true' });
  const col = ejeColor(ind.eje);
  const sx = ind.id.slice(0, 2);
  const numeric = !['rank', 'risk', 'frac', 'dual'].includes(ind.tipo);
  const m = ind.meta && ind.meta.value;
  const official = ind.serie.filter((e) => e.v != null && !e.prelim);
  if (sx === 's2' && numeric && ind.dir === 'up' && typeof m === 'number' && m > 0) {
    // avance hacia la meta 2030
    const last = official.length ? official[official.length - 1].v : null;
    s('rect', { x: 0, y: 14, width: W - 10, height: 7, rx: 3.5, style: 'fill:var(--line)' }, svg);
    if (last != null) {
      const f = Math.max(0, Math.min(1, last / m));
      s('rect', { x: 0, y: 14, width: Math.max(4, (W - 10) * f), height: 7, rx: 3.5, style: `fill:${col}` }, svg);
      stext(svg, 0, 10, `${nf0.format(Math.min(999, (last / m) * 100))}% de la meta`, { style: 'font-size:10px;fill:var(--muted);font-family:var(--font-body)' });
    } else {
      s('rect', { x: 0.5, y: 14.5, width: W - 11, height: 6, rx: 3, style: 'fill:none;stroke:var(--line-2);stroke-dasharray:3 3' }, svg);
    }
    s('line', { x1: W - 10, x2: W - 10, y1: 10, y2: 25, style: 'stroke:var(--ink-2);stroke-width:1.5' }, svg);
    return svg;
  }
  const pts = ind.serie.map((e, i) => ({ i, v: e.v, p: e.prelim }));
  const nums = pts.filter((p) => p.v != null);
  if (!nums.length) {
    s('line', { x1: 2, x2: W - 2, y1: H / 2, y2: H / 2, style: 'stroke:var(--line-2);stroke-dasharray:3 4' }, svg);
    return svg;
  }
  const val = (v) => (ind.tipo === 'rank' ? -mid(v) : ind.tipo === 'risk' ? -RISK_ORDER[v] : ind.tipo === 'dual' ? v[0] : v);
  const vs = nums.map((p) => val(p.v));
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (typeof m === 'number' && numeric) { lo = Math.min(lo, m); hi = Math.max(hi, m); }
  if (['num', 'mm', 'm2'].includes(ind.tipo) && lo > 0) lo = 0;
  if (hi === lo) { hi += 1; lo -= 1; }
  const n = ind.serie.length;
  const x = (i) => 4 + (i / (n - 1)) * (W - 8);
  const y = (v) => H - 5 - ((v - lo) / (hi - lo)) * (H - 10);
  if (typeof m === 'number' && numeric) s('line', { x1: 0, x2: W, y1: y(m), y2: y(m), style: 'stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3;opacity:.7' }, svg);
  const colStyle = ['num', 'mm', 'm2'].includes(ind.tipo);
  if (colStyle) {
    const bw = Math.min(10, (W - 8) / n - 3);
    nums.forEach((p) => s('rect', { x: x(p.i) - bw / 2, y: y(val(p.v)), width: bw, height: Math.max(1.5, H - 5 - y(val(p.v)) + (lo < 0 ? 0 : 0)), rx: 1.5, style: `fill:${col};opacity:${p.p ? 0.45 : 1}` }, svg));
  } else {
    let d = '';
    pts.forEach((p, k) => { if (p.v == null) return; d += (d && pts[k - 1] && pts[k - 1].v != null ? 'L' : 'M') + x(p.i) + ',' + y(val(p.v)); });

    const bodyId = `b-${state.sx}-${e.id}`;
    const sec = h('section', { class: 'eje', 'aria-labelledby': `t-${bodyId}` });
    const head = h('button', { class: 'eje-head', type: 'button', 'aria-expanded': open ? 'true' : 'false', 'aria-controls': bodyId },
      h('span', { class: 'eje-num', style: `background:${ejeDeep(e.id)}`, text: k + 1 }),
      h('span', { class: 'eje-title' }, h('small', { text: `Eje estratégico ${k + 1}` }), h('h3', { id: `t-${bodyId}`, text: e.nombre })),
      h('span', { class: 'eje-meta' }, distBar(SX.indicadores.filter((i) => i.eje === e.id), state.sx), h('span', { text: `${inds.length} ${inds.length === 1 ? 'indicador' : 'indicadores'}` })),
      chevron('chev'));
    const body = h('div', { id: bodyId, hidden: !open });
    head.addEventListener('click', () => {
      const now = head.getAttribute('aria-expanded') !== 'true';
      head.setAttribute('aria-expanded', now ? 'true' : 'false');
      body.hidden = !now;
      if (now) state.closedEjes.delete(state.sx + e.id); else state.closedEjes.add(state.sx + e.id);
    });
    const oes = SX.oes.filter((o) => o.eje === e.id);
    oes.forEach((o) => {
      const oi = inds.filter((i) => i.oe === o.n);
      if (!oi.length) return;
      const g = h('div', { class: 'oe' });
      g.append(h('div', { class: 'oe-head' }, h('b', null, h('span', { text: `OE ${o.n}` }), o.nombre), o.desc ? h('p', { text: o.desc }) : null));
      oi.forEach((i) => g.append(indItem(i)));
      body.append(g);
    });
    sec.append(head, body);
    root.append(sec);
  });
  if (!any) root.append(h('p', { class: 'noresult', text: state.q ? 'No hay indicadores de esta etapa que coincidan con la búsqueda en el eje seleccionado. Prueba con otra palabra o selecciona todos los ejes.' : 'No hay indicadores para mostrar.' }));
  syncToggleAll();
}

/* ================================================================ controles */
function renderSeg() {
  const seg = document.getElementById('seg');
  seg.replaceChildren();
  ['s1', 's2'].forEach((k) => {
    const SX = DATA.sexenios[k];
    const b = h('button', { type: 'button', role: 'radio', 'aria-checked': state.sx === k ? 'true' : 'false', tabindex: state.sx === k ? '0' : '-1', onclick: () => setSx(k),
      onkeydown: (e) => { if (['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown'].includes(e.key)) { e.preventDefault(); const o = k === 's1' ? 's2' : 's1'; setSx(o); seg.querySelector(`[data-k="${o}"]`).focus(); } }, 'data-k': k },
      h('b', { text: SX.nombre }), h('small', { text: `${SX.periodo} · ${SX.indicadores.length} indicadores` }));
    seg.append(b);
  });
}
function renderChips() {
  const SX = DATA.sexenios[state.sx];
  const box = document.getElementById('chips');
  box.replaceChildren();
  box.append(h('button', { class: 'chip', type: 'button', 'aria-pressed': state.eje === 'all' ? 'true' : 'false', onclick: () => setEje('all') }, 'Todos los ejes'));
  SX.ejes.forEach((e, k) => box.append(h('button', { class: 'chip', type: 'button', 'aria-pressed': state.eje === e.id ? 'true' : 'false', onclick: () => setEje(e.id), title: e.nombre },
    h('span', { class: 'dot', style: `background:${ejeColor(e.id)}` }), `${k + 1}. ${SHORT[e.id]}`)));
}
function renderFoot() {
  const f = document.getElementById('foot');
  f.replaceChildren(
    h('p', null, h('b', { text: 'Fuentes. ' }), 'Primera Etapa: ' + DATA.sexenios.s1.corte + '. Segunda Etapa: ' + DATA.sexenios.s2.corte + '. Desagregaciones: Gráficos Informe Año 2025.'),
    h('p', { text: 'Los montos se expresan en millones de pesos (MM$). Los resultados 2026 son preliminares. Las posiciones de ranking se leen de menor a mayor: un número menor indica una mejor posición. En la Primera Etapa, «Sin medición» corresponde a la categoría «No aplica» del cuadro de mando institucional.' }),
    h('p', { text: 'Dirección de Estudios Estratégicos · Vicerrectoría de Planificación y Desarrollo · Universidad de Los Lagos' }));
}
function setSx(k) {
  if (state.sx === k) return;
  state.sx = k; state.eje = 'all';
  try { localStorage.setItem('pedi-sx', k); } catch (e) { /* sin almacenamiento */ }
  renderSeg(); renderChips(); renderSummary(); renderEjes();
  setHash(k);
}
function setEje(e) {
  state.eje = e;
  renderChips(); renderSummary(); renderEjes();
}
function syncToggleAll() {
  const b = document.getElementById('toggleAll');
  const vis = visibleInds();
  const allOpen = vis.length && vis.every((i) => state.open.has(i.id));
  b.textContent = allOpen ? 'Cerrar todos' : 'Abrir todos';
  b.dataset.mode = allOpen ? 'close' : 'open';
}
document.getElementById('toggleAll').addEventListener('click', (e) => {
  const vis = visibleInds();
  if (e.currentTarget.dataset.mode === 'close') vis.forEach((i) => state.open.delete(i.id));
  else { vis.forEach((i) => state.open.add(i.id)); state.closedEjes.clear(); }
  renderEjes();
});
function setHash(id) { try { history.replaceState(null, '', '#' + id); } catch (e) { /* entorno sin historial */ } }
function jumpTo(id) {
  const ind = byId[id];
  if (!ind) return;
  const k = id.slice(0, 2);
  if (state.sx !== k) { state.sx = k; state.eje = 'all'; renderSeg(); renderChips(); renderSummary(); }
  state.q = ''; state.qRes = null; qIn.value = ''; closeSugg();
  state.open.add(id); state.closedEjes.delete(k + ind.eje);
  renderEjes();
  setHash(id);
  const node = document.getElementById(id);
  if (node) {
    const top = node.getBoundingClientRect().top + window.scrollY - (document.querySelector('.controls').offsetHeight + 12);
    window.scrollTo({ top, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    const btn = node.querySelector('.ind-row'); if (btn) btn.focus({ preventScroll: true });
  }
}

/* ================================================================ inicio */
(function init() {
  if (!document.documentElement.lang) document.documentElement.lang = 'es';
  const hash = (location.hash || '').slice(1);
  if (hash === 's1' || hash === 's2') state.sx = hash;
  renderSeg(); renderChips(); renderSummary(); renderEjes(); renderFoot();
  if (/^s[12]-\d+$/.test(hash) && byId[hash]) setTimeout(() => jumpTo(hash), 60);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redrawAll);
  window.addEventListener('scroll', hideTip, { passive: true });
  const mq = matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', redrawAll);
  new MutationObserver(redrawAll).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
})();

</script>
</body>
</html>
